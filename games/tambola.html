<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambola Number Caller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-500 to-blue-700 text-white min-h-screen flex flex-col items-center p-4">

  <h1 class="text-4xl font-bold mt-6 mb-4 flex items-center gap-3">
    <i class="fa-solid fa-ticket"></i> Tambola Number Caller
  </h1>

  <!-- Current Number -->
  <div id="current-number" class="text-7xl font-extrabold bg-white text-blue-600 px-12 py-8 rounded-2xl shadow-lg mt-6 mb-6">
    --
  </div>

  <!-- Buttons -->
  <div class="flex gap-4 mb-8">
    <button onclick="callNumber()" class="bg-white text-blue-600 font-semibold px-6 py-3 rounded-xl shadow-md hover:bg-gray-100 transition flex items-center gap-2">
      <i class="fa-solid fa-bullhorn"></i> Call Number
    </button>
    <button onclick="resetGame()" class="bg-red-500 text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:bg-red-600 transition flex items-center gap-2">
      <i class="fa-solid fa-rotate-right"></i> Reset
    </button>
  </div>

  <!-- Called Numbers -->
  <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
    <i class="fa-solid fa-list-ol"></i> Called Numbers
  </h2>

  <div id="called-numbers" class="grid grid-cols-9 gap-2 bg-white/10 p-4 rounded-2xl max-w-4xl w-full">
    <!-- Numbers will appear here -->
  </div>

  <script>
    let numbers = [];
    let calledNumbers = [];

    function callNumber() {
      if (calledNumbers.length >= 90) {
        alert("All numbers have been called!");
        return;
      }

      let randomIndex = Math.floor(Math.random() * numbers.length);
      let number = numbers.splice(randomIndex, 1)[0]; 

      calledNumbers.push(number);

      document.getElementById("current-number").textContent = number;
      updateCalledNumbers();
    }

    function updateCalledNumbers() {
      const container = document.getElementById("called-numbers");
      container.innerHTML = "";
      calledNumbers.forEach(num => {
        let span = document.createElement("span");
        span.textContent = num;
        span.className = "bg-white text-blue-600 font-bold rounded-lg px-3 py-2 text-center shadow-md";
        container.appendChild(span);
      });
    }

    function resetGame() {
      numbers = Array.from({length: 90}, (_, i) => i + 1); 
      calledNumbers = [];
      document.getElementById("current-number").textContent = "--";
      document.getElementById("called-numbers").innerHTML = "";
    }

    // Initialize
    resetGame();
  </script>
</body>
</html>
