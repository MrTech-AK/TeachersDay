<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambola Number Caller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .number-animate {
      animation: pop 0.5s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .highlight {
      background: #38bdf8 !important;
      color: #fff !important;
      box-shadow: 0 0 15px #38bdf8;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-900 min-h-screen flex flex-col items-center text-white p-4">

  <h1 class="text-4xl font-extrabold mt-6 flex items-center gap-3 drop-shadow-lg">
    <i class="fa-solid fa-chalkboard-teacher"></i> Teachers’ Day Tambola Caller
  </h1>

  <!-- Current Number -->
  <div id="current-number" class="glass number-animate text-8xl font-extrabold text-blue-100 px-16 py-10 rounded-3xl shadow-2xl mt-10 mb-6">
    --
  </div>

  <!-- Buttons -->
  <div class="flex gap-6 mb-10">
    <button onclick="callNumber()" class="bg-white text-blue-700 font-semibold px-6 py-3 rounded-xl shadow-md hover:bg-gray-100 transition flex items-center gap-2">
      <i class="fa-solid fa-bullhorn"></i> Call Number
    </button>
    <button onclick="resetGame()" class="bg-red-500 text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:bg-red-600 transition flex items-center gap-2">
      <i class="fa-solid fa-rotate-right"></i> Reset
    </button>
  </div>

  <!-- Tambola Board -->
  <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
    <i class="fa-solid fa-table-cells"></i> Tambola Board
  </h2>

  <div id="board" class="grid grid-cols-10 gap-2 glass p-4 rounded-2xl shadow-lg max-w-5xl w-full text-center">
    <!-- Numbers 1–90 will load here -->
  </div>

  <script>
    let numbers = [];
    let calledNumbers = [];

    function initBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      for (let i = 1; i <= 90; i++) {
        const span = document.createElement("div");
        span.textContent = i;
        span.id = "num-" + i;
        span.className = "bg-white text-blue-700 font-bold rounded-lg py-2 text-center shadow-md";
        board.appendChild(span);
      }
    }

    function callNumber() {
      if (calledNumbers.length >= 90) {
        alert("🎉 All numbers have been called!");
        return;
      }

      let randomIndex = Math.floor(Math.random() * numbers.length);
      let number = numbers.splice(randomIndex, 1)[0]; 
      calledNumbers.push(number);

      // Update current number
      const currentNum = document.getElementById("current-number");
      currentNum.textContent = number;
      currentNum.classList.remove("number-animate");
      void currentNum.offsetWidth; // restart animation
      currentNum.classList.add("number-animate");

      // Highlight number permanently
      const cell = document.getElementById("num-" + number);
      cell.classList.add("highlight");

      // Confetti at the end
      if (calledNumbers.length === 90) {
        confetti();
      }
    }

    function resetGame() {
      numbers = Array.from({length: 90}, (_, i) => i + 1); 
      calledNumbers = [];
      document.getElementById("current-number").textContent = "--";
      initBoard();
    }

    // Confetti effect
    function confetti() {
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        const colors = ["#ffffff", "#38bdf8", "#1d4ed8"];
        confettiEffect({
          particleCount: 5,
          angle: Math.random() * 360,
          spread: 60,
          origin: { x: Math.random(), y: Math.random() - 0.2 },
          colors: colors
        });
        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    // Mini confetti generator
    function confettiEffect(opts) {
      const defaults = {
        particleCount: 50,
        spread: 70,
        origin: { y: 0.6 }
      };
      const confettiCanvas = document.createElement("canvas");
      document.body.appendChild(confettiCanvas);
      const myConfetti = confetti.create(confettiCanvas, { resize: true, useWorker: true });
      myConfetti(Object.assign({}, defaults, opts));
    }

    // External confetti library
    (function() {
      var script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js";
      document.head.appendChild(script);
    })();

    // Init
    resetGame();
  </script>
</body>
</html>
